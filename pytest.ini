[pytest]
# Pytest configuration for the Customer Support Analyzer backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = app/tests

# Minimum Python version
minversion = 3.12

# Command line options always used
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Run tests in parallel (requires pytest-xdist)
    # -n auto
    # Coverage options
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage is below threshold
    --cov-fail-under=90
    # Strict markers - fail on unknown markers
    --strict-markers
    # Show warnings
    -W ignore::DeprecationWarning

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (test multiple components together)
    e2e: End-to-end tests (test complete user workflows)
    slow: Tests that take more than 1 second
    auth: Authentication and authorization tests
    ml: Machine learning related tests
    api: API endpoint tests
    database: Database tests
    cache: Redis/caching tests
    celery: Celery task tests
    security: Security tests
    performance: Performance tests

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */migrations/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Debug-only code
    def __repr__
    # Abstract methods
    @abstractmethod
    # Type checking blocks
    if TYPE_CHECKING:
    # Non-runnable code
    if __name__ == .__main__.:
    # Defensive programming
    raise AssertionError
    raise NotImplementedError
    # Pass statements
    pass

[coverage:html]
directory = htmlcov
